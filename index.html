<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Pisicuța Pufi</title>
<meta name="description" content="Un joc cu o pisicuță de îngrijit, cinci mini-jocuri, haine, decoruri și scrisori de dragoste.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pufi">
<meta name="theme-color" content="#ffd3e0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<style>
/* Layout: full-bleed canvas world (room / mini-games) with a floating HUD on top, a dock at the bottom and sheet modals. */
:root{
  --cream:#fff7f2; --panel:#fffaf7; --pink:#ff9cbc; --rose:#ff5c8a; --plum:#4a2f3f; --plum-soft:#8a6878;
  --mint:#6fd3b5; --butter:#ffd76a; --line:#f3d3dd; --shade:rgba(74,47,63,.18);
  --f-display:"Fredoka","Chalkboard SE","Comic Sans MS","Trebuchet MS",system-ui,sans-serif;
  --f-body:"Nunito","Avenir Next","Segoe UI",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden;background:var(--cream);color:var(--plum);font-family:var(--f-body);
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;overscroll-behavior:none}
#cv{position:fixed;inset:0;width:100%;height:100%;touch-action:none;display:block}
button{font-family:var(--f-display);color:var(--plum);touch-action:manipulation;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible{outline:3px solid var(--rose);outline-offset:2px}

/* ---------- HUD ---------- */
#hud{position:fixed;left:0;right:0;top:0;display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  padding:calc(env(safe-area-inset-top,0px) + 10px) calc(env(safe-area-inset-right,0px) + 14px) 8px calc(env(safe-area-inset-left,0px) + 14px);pointer-events:none}
#hud > *{pointer-events:auto}
.pill{background:rgba(255,250,247,.92);border:2px solid var(--line);border-radius:999px;box-shadow:0 3px 0 var(--shade);display:flex;align-items:center}
.who{gap:10px;padding:4px 14px 4px 4px;min-width:0}
.lvl{width:42px;height:42px;border-radius:50%;background:var(--rose);color:#fff;display:grid;place-items:center;font:700 19px var(--f-display);flex:none;position:relative}
.lvl small{position:absolute;bottom:-7px;font-size:9px;letter-spacing:.06em;background:var(--plum);border-radius:6px;padding:0 5px}
.who-name{font:600 17px var(--f-display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:34vw}
.xpbar{height:7px;width:110px;border-radius:9px;background:#f8e3ea;overflow:hidden;margin-top:3px}
.xpbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--pink),var(--rose));border-radius:9px;transition:width .4s}
.stats{gap:12px;padding:6px 14px}
.stat{display:flex;align-items:center;gap:5px;font-size:17px}
.bar{width:56px;height:10px;border-radius:9px;background:#f6e6ec;overflow:hidden}
.bar i{display:block;height:100%;border-radius:9px;transition:width .5s,background .5s}
.coins{margin-left:auto;gap:6px;padding:6px 14px;font:700 19px var(--f-display);font-variant-numeric:tabular-nums}
.coin{width:22px;height:22px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff3b0,#ffcc33 55%,#e0a100);border:2px solid #c98a00;flex:none}

/* ---------- Dock ---------- */
#dock{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;gap:8px;flex-wrap:wrap;
  padding:8px calc(env(safe-area-inset-right,0px) + 12px) calc(env(safe-area-inset-bottom,0px) + 12px) calc(env(safe-area-inset-left,0px) + 12px)}
.dbtn{width:74px;height:72px;border-radius:22px;background:rgba(255,250,247,.95);border:2px solid var(--line);box-shadow:0 4px 0 var(--shade);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:13px;font-weight:600;transition:transform .08s}
.dbtn b{font-size:28px;line-height:1;font-weight:400}
.dbtn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--shade)}
.dbtn.on{background:var(--rose);color:#fff;border-color:var(--rose)}
.dbtn .dot{position:absolute;margin:-48px 0 0 46px;width:12px;height:12px;border-radius:50%;background:var(--rose);border:2px solid #fff}
.dbtn{position:relative}

/* ---------- Game HUD ---------- */
#ghud{position:fixed;left:0;right:0;top:0;display:flex;align-items:center;gap:10px;
  padding:calc(env(safe-area-inset-top,0px) + 10px) calc(env(safe-area-inset-right,0px) + 14px) 0 calc(env(safe-area-inset-left,0px) + 14px);pointer-events:none}
#ghud > *{pointer-events:auto}
.gbtn{width:50px;height:50px;border-radius:50%;background:rgba(255,250,247,.95);border:2px solid var(--line);box-shadow:0 3px 0 var(--shade);font-size:22px;font-weight:700}
#ginfo{flex:1;display:flex;justify-content:center;gap:10px;flex-wrap:wrap;pointer-events:none}
#ginfo .pill{padding:7px 16px;font:700 20px var(--f-display);font-variant-numeric:tabular-nums;gap:6px}

/* ---------- Modal ---------- */
#modal{position:fixed;inset:0;background:rgba(74,47,63,.38);display:flex;align-items:center;justify-content:center;
  padding:calc(env(safe-area-inset-top,0px) + 16px) 16px calc(env(safe-area-inset-bottom,0px) + 16px);z-index:20;animation:fade .2s}
.sheet{background:var(--panel);border-radius:28px;width:100%;max-width:680px;max-height:100%;display:flex;flex-direction:column;
  box-shadow:0 10px 0 rgba(74,47,63,.15),0 20px 60px rgba(74,47,63,.25);border:3px solid #fff;animation:pop .28s cubic-bezier(.2,1.4,.4,1)}
.sheet header{display:flex;align-items:center;gap:10px;padding:16px 18px 6px 22px}
.sheet h2{font:700 26px var(--f-display);margin:0;flex:1;text-wrap:balance}
.xbtn{width:44px;height:44px;border-radius:50%;background:#fbe9ef;font-size:20px;font-weight:700;flex:none}
.mbody{padding:8px 22px 22px;overflow-y:auto;-webkit-overflow-scrolling:touch;user-select:text;-webkit-user-select:text}
@keyframes fade{from{opacity:0}}
@keyframes pop{from{transform:scale(.85) translateY(20px);opacity:0}}
.lead{margin:0 0 14px;font-size:16px;line-height:1.5;color:var(--plum-soft)}
.tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.tab{padding:9px 16px;border-radius:999px;background:#fbe9ef;font-size:16px;font-weight:600}
.tab.on{background:var(--plum);color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:12px}
.card{background:#fff;border:2px solid var(--line);border-radius:20px;padding:10px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;font-family:var(--f-body)}
.card canvas{width:100px;height:100px}
.card .ico{font-size:48px;height:72px;display:grid;place-items:center}
.card .nm{font:600 16px var(--f-display)}
.card .ds{font-size:13px;color:var(--plum-soft);line-height:1.3;min-height:2.6em}
.card.sel{border-color:var(--rose);box-shadow:0 0 0 3px #ffd0de}
.price{display:inline-flex;align-items:center;gap:5px;font:700 16px var(--f-display);padding:7px 14px;border-radius:999px;background:var(--butter);margin-top:auto}
.price .coin{width:16px;height:16px;border-width:1.5px}
.price.owned{background:var(--mint);color:#fff}
.price.poor{opacity:.5}
.big{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:14px 26px;border-radius:999px;background:var(--rose);color:#fff;font:700 20px var(--f-display);box-shadow:0 4px 0 #c93a66}
.big:active{transform:translateY(3px);box-shadow:0 1px 0 #c93a66}
.big.alt{background:#fbe9ef;color:var(--plum);box-shadow:0 4px 0 #e7c3cf}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:16px}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px;font:600 15px var(--f-display)}
.field input{font:700 19px var(--f-body);padding:12px 16px;border-radius:16px;border:2px solid var(--line);background:#fff;color:var(--plum);width:100%;-webkit-user-select:text;user-select:text}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.sw{width:50px;height:50px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px var(--line)}
.sw.on{box-shadow:0 0 0 4px var(--rose)}
.prev{display:block;width:180px;height:180px;margin:0 auto 6px}
.games{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.game{background:#fff;border:2px solid var(--line);border-radius:22px;padding:14px;display:flex;gap:12px;align-items:center;text-align:left;box-shadow:0 4px 0 var(--shade)}
.game:active{transform:translateY(3px);box-shadow:0 1px 0 var(--shade)}
.game .gi{font-size:40px;flex:none;width:58px;height:58px;border-radius:18px;display:grid;place-items:center}
.game .nm{font:600 18px var(--f-display);display:block}
.game .ds{font:500 13px var(--f-body);color:var(--plum-soft);display:block;line-height:1.3}
.game .bs{font:700 12px var(--f-body);color:var(--rose);display:block;margin-top:3px;letter-spacing:.04em;text-transform:uppercase}
.food{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
.letter{background:#fffdf8;border-radius:18px;padding:26px 24px;border:2px dashed #f0c2d2;font:500 19px/1.6 var(--f-body);color:var(--plum);position:relative;max-width:65ch;margin:0 auto}
.letter .sig{text-align:right;font:600 18px var(--f-display);color:var(--rose);margin-top:12px}
.notes{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:12px}
.env{aspect-ratio:4/3;max-width:100%;border-radius:16px;background:#ffe1ea;border:2px solid #f5bccd;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font:600 14px var(--f-display);position:relative;overflow:hidden}
.env b{font-size:34px;font-weight:400}
.env.new::after{content:"nou";position:absolute;top:6px;right:6px;background:var(--rose);color:#fff;font-size:11px;padding:2px 7px;border-radius:9px;letter-spacing:.05em}
.env.locked{background:#f4eef0;border-color:#e6dadf;color:#b7a5ad}
.ach{display:flex;gap:12px;align-items:center;padding:12px 4px;border-bottom:2px solid #f8e8ee}
.ach b{font-size:30px;width:44px;text-align:center;font-weight:400;flex:none}
.ach .nm{font:600 17px var(--f-display)}
.ach .ds{font-size:14px;color:var(--plum-soft)}
.ach.lock{opacity:.45;filter:grayscale(1)}
.ach .rw{margin-left:auto;font:700 14px var(--f-display);white-space:nowrap}
.result{text-align:center}
.result .score{font:700 64px var(--f-display);color:var(--rose);line-height:1;font-variant-numeric:tabular-nums}
.result .sub{font:600 16px var(--f-display);color:var(--plum-soft);margin-top:4px}
.chips{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:14px}
.chip{background:#fff;border:2px solid var(--line);border-radius:999px;padding:8px 16px;font:600 17px var(--f-display);display:flex;gap:6px;align-items:center}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:2px solid #f8e8ee;font:600 18px var(--f-display)}
.toggle{width:62px;height:36px;border-radius:999px;background:#eadbe1;position:relative;transition:background .2s;flex:none}
.toggle::after{content:"";position:absolute;top:4px;left:4px;width:28px;height:28px;border-radius:50%;background:#fff;transition:left .2s;box-shadow:0 2px 3px var(--shade)}
.toggle.on{background:var(--mint)}
.toggle.on::after{left:30px}
.danger{color:#d43c5f;background:#ffe8ee;padding:10px 16px;border-radius:999px;font-size:16px;font-weight:600}

#toasts{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 74px);transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;align-items:center;z-index:30;pointer-events:none;width:min(92vw,520px)}
.toast{background:var(--plum);color:#fff;padding:11px 20px;border-radius:999px;font:600 16px var(--f-display);box-shadow:0 6px 18px rgba(74,47,63,.3);animation:tin .3s cubic-bezier(.2,1.4,.4,1);text-align:center}
@keyframes tin{from{transform:translateY(-14px) scale(.9);opacity:0}}

@media (max-width:620px){
  .dbtn{width:58px;height:58px;border-radius:18px;font-size:11px}
  .dbtn b{font-size:23px}
  .bar{width:38px}
  .xpbar{width:80px}
  .stats{gap:8px;padding:5px 10px}
  .stat{font-size:14px}
  .sheet h2{font-size:22px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<canvas id="cv"></canvas>

<div id="hud" hidden>
  <div class="pill who">
    <div class="lvl"><span id="lvlNum">1</span><small>NIV</small></div>
    <div style="min-width:0">
      <div class="who-name" id="catName">Pufi</div>
      <div class="xpbar"><i id="xpFill"></i></div>
    </div>
  </div>
  <div class="pill stats">
    <div class="stat" title="Sătulă">🍗<div class="bar"><i id="bHunger"></i></div></div>
    <div class="stat" title="Fericită">💖<div class="bar"><i id="bFun"></i></div></div>
    <div class="stat" title="Odihnită">⚡<div class="bar"><i id="bEnergy"></i></div></div>
  </div>
  <div class="pill coins"><span class="coin"></span><span id="coins">0</span></div>
</div>

<div id="dock" hidden>
  <button class="dbtn" id="dFood"><b>🍣</b>Mâncare</button>
  <button class="dbtn" id="dGames"><b>🎮</b>Jocuri</button>
  <button class="dbtn" id="dShop"><b>🛍️</b>Magazin</button>
  <button class="dbtn" id="dWard"><b>🎀</b>Garderobă</button>
  <button class="dbtn" id="dNotes"><b>💌</b>Scrisori</button>
  <button class="dbtn" id="dLaser" hidden><b>🔴</b>Laser</button>
  <button class="dbtn" id="dSleep"><b>🌙</b>Somn</button>
  <button class="dbtn" id="dAch"><b>🏆</b>Premii</button>
  <button class="dbtn" id="dSet"><b>⚙️</b>Setări</button>
</div>

<div id="ghud" hidden>
  <button class="gbtn" id="gExit" aria-label="Ieși">✕</button>
  <div id="ginfo"></div>
  <button class="gbtn" id="gPause" aria-label="Pauză">II</button>
</div>

<div id="modal" hidden><div class="sheet"><header><h2 id="mTitle"></h2><button class="xbtn" id="mClose" aria-label="Închide">✕</button></header><div class="mbody" id="mBody"></div></div></div>
<div id="toasts"></div>

<script>
'use strict';
/* =====================================================================
   PISICUȚA PUFI — un joc făcut cu drag.
   Poți personaliza scrisorile de mai jos: {nume} = numele ei, {pisica} = numele pisicii.
   ===================================================================== */
const LOVE_NOTES = [
  'Bun venit în căsuța lui {pisica}, {nume}! Am făcut jocul ăsta doar pentru tine. Tu ai grijă de {pisica}, iar eu am grijă de tine.',
  'Știai că pisicile torc când sunt fericite? Eu nu știu să torc, dar exact așa mă simt lângă tine.',
  'Ai un zâmbet care face orice zi mai frumoasă. Chiar și pe cele cu ploaie.',
  'Dacă aș fi pisică, aș dormi toată ziua în brațele tale. Stai, asta aș vrea să fac și acum.',
  'Mulțumesc că ești tu. Atât de simplu și atât de mult.',
  'Ești cea mai frumoasă parte din fiecare zi a mea.',
  'Promit să-ți dau mereu ultima bucată de prăjitură. Bine, aproape mereu.',
  'Când ești tristă, să știi că cineva (eu!) se gândește la tine chiar acum.',
  'Ai voie să mă trezești oricând ca să-mi spui ceva. Ca o pisică la 5 dimineața.',
  'Lângă tine, o zi obișnuită devine ziua mea preferată.',
  'Ești curajoasă, deșteaptă și foarte, foarte drăguță. Să nu uiți asta niciodată.',
  'Dacă te-ai plictisit de jocuri, vino să mă îmbrățișezi. Nu costă nicio monedă.',
  'Am căutat un cuvânt pentru cât țin la tine. Nu există, așa că am făcut un joc.',
  '{pisica} zice că ești cea mai bună stăpână. Eu zic că ești cea mai bună, punct.',
  'Mulțumesc pentru toată răbdarea cu mine. Știu că nu e mereu ușor.',
  'Vreau să mai vedem multe locuri împreună. Tu alegi primul.',
  'Nivelul ăsta merită un pupic. Îl poți revendica de la mine oricând.',
  'Fiecare monedă din joc e un motiv pentru care te iubesc. Ai strâns deja foarte multe.',
  'Dacă ai ajuns până aici, înseamnă că ai avut grijă de {pisica} zi de zi. Exact ca de mine.',
  'Nivelul 20! Ești oficial campioana inimii mele. Te iubesc, {nume}!',
];
const SWEET = [
  'Ești frumoasă azi. (Și ieri. Și mâine.)', 'Cineva se gândește la tine chiar acum.', 'Ai cel mai frumos râs.',
  '{pisica} îți trimite o mie de torsături.', 'Azi meriți ceva dulce. Cere-mi!', 'Ești preferata mea. Din tot universul.',
  'O îmbrățișare te așteaptă. Poți s-o revendici oricând.', 'Să ai o zi la fel de drăguță ca tine.',
  'Mă faci fericit doar existând.', 'Tu + eu = cea mai bună echipă.', 'Bea apă, zâmbește, ești minunată.',
  'Ești motivul pentru care zâmbesc la telefon.', 'Ochii tăi sunt mai frumoși decât toate stelele.',
];
const SIGNATURE = 'Cu drag, al tău';

/* ---------- utilitare ---------- */
const $ = s => document.querySelector(s);
const rand = (a, b) => a + Math.random() * (b - a);
const irand = (a, b) => Math.floor(rand(a, b + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const TAU = Math.PI * 2;
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today = () => { const d = new Date(); return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate(); };
const hourNow = () => { const d = new Date(); return d.getHours() + d.getMinutes() / 60; };

/* ---------- date ---------- */
const FURS = {
  orange:  {name:'Portocalie', base:'#f6a85e', dark:'#d97a36', light:'#fff0dc', pattern:'tabby'},
  grey:    {name:'Gri',        base:'#a4acbd', dark:'#717a8e', light:'#eef1f6', pattern:'tabby'},
  black:   {name:'Neagră',     base:'#3d3846', dark:'#24212b', light:'#5e5868', pattern:'solid'},
  white:   {name:'Albă',       base:'#fdfaf6', dark:'#e3dbd2', light:'#ffffff', pattern:'solid'},
  cream:   {name:'Crem',       base:'#f5dcb4', dark:'#dcb787', light:'#fff6e8', pattern:'solid'},
  calico:  {name:'Tricoloră',  base:'#fdf8f1', dark:'#e2d7c8', light:'#ffffff', pattern:'calico'},
  tuxedo:  {name:'Smoking',    base:'#36323d', dark:'#211e27', light:'#ffffff', pattern:'tuxedo'},
  siamese: {name:'Siameză',    base:'#f3e6d2', dark:'#5e4537', light:'#fffaf2', pattern:'siamese'},
};
const EYES = {green:'#7ccf6b', blue:'#6fb7ff', amber:'#f2b134', brown:'#a86b3c', violet:'#b48cff'};
const EYE_NAMES = {green:'Verzi', blue:'Albaștri', amber:'Chihlimbar', brown:'Căprui', violet:'Violet'};

const HATS = [
  {id:'bow', name:'Fundiță', price:40, ds:'Clasică și drăgălașă'},
  {id:'flowers', name:'Coroniță de flori', price:60, ds:'Pentru plimbări de primăvară'},
  {id:'party', name:'Coif de petrecere', price:50, ds:'Orice zi poate fi o petrecere'},
  {id:'beret', name:'Beretă', price:70, ds:'Pisică artistă din Paris'},
  {id:'winter', name:'Căciuliță', price:80, ds:'Caldă și pufoasă'},
  {id:'witch', name:'Pălărie de vrăjitoare', price:120, ds:'Miau-gie curată'},
  {id:'topHat', name:'Joben', price:150, ds:'Foarte elegantă'},
  {id:'crown', name:'Coroană', price:300, ds:'Pentru regina casei'},
];
const ACCS = [
  {id:'bell', name:'Clopoțel', price:30, ds:'Cling-cling la fiecare pas'},
  {id:'bandana', name:'Bandană', price:45, ds:'Roșie cu buline'},
  {id:'bowtie', name:'Papion', price:40, ds:'Gata de gală'},

const P = [];
function addP(o) { P.push(Object.assign({life:1, max:1, vx:0, vy:0, g:0, rot:0, vr:0, size:12}, o)); if (P.length > 350) P.shift(); }

function zzz(x, y) { addP({type:'text', x, y, vx:rand(10, 30), vy:-30, life:2, max:2, text:'z', color:'#8a6878', size:rand(16, 26)}); }
function updP(dt) {
  for (let i = P.length - 1; i >= 0; i--) {
    const p = P[i]; p.life -= dt; if (p.life <= 0) { P.splice(i, 1); continue; }
    p.vy += p.g * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.vr * dt;

}

  for (const p of P) {
    c.globalAlpha = clamp(p.life / p.max * 2.2, 0, 1);
    if (p.type === 'heart') drawHeart(c, p.x, p.y, p.size, p.color);
    else if (p.type === 'star') { c.save(); c.translate(p.x, p.y); c.rotate(p.rot); c.fillStyle = p.color; c.beginPath();
      for (let k = 0; k < 8; k++) { const r = k % 2 ? p.size * .4 : p.size; c.lineTo(Math.cos(k * Math.PI / 4) * r, Math.sin(k * Math.PI / 4) * r); } c.fill(); c.restore(); }

    else if (p.type === 'text') { c.font = `700 ${p.size}px ${FONT}`; c.textAlign = 'center';
      c.lineWidth = 4; c.strokeStyle = '#fff'; c.strokeText(p.text, p.x, p.y); c.fillStyle = p.color; c.fillText(p.text, p.x, p.y); }

/* ---------- progres: monede, XP, niveluri, premii ---------- */
const xpNeed = l => 40 + l * 25;
function addCoins(n, x, y) {
  if (!n) return; S.coins = Math.max(0, S.coins + n);
  if (x != null) { floatText(x, y, (n > 0 ? '+' : '') + n, '#e0a100'); }
  if (n > 0) SFX.coin(); updateHud();
}
function addXP(n) {
  S.xp += n;
  while (S.xp >= xpNeed(S.level)) {
    S.xp -= xpNeed(S.level); S.level++;
    const bonus = 20 + S.level * 5; S.coins += bonus;
    setTimeout(() => { SFX.level(); confetti(120); toast(`Nivelul ${S.level}! +${bonus} monede`); if (S.level - 1 < LOVE_NOTES.length) toast('💌 Ai primit o scrisoare nouă!'); }, 300);
  }
  updateHud(); checkAch();
}
function stat(k, d) { S[k] = clamp(S[k] + d, 0, 100); }
function checkAch() {
  for (const a of ACH) if (!S.ach[a.id] && a.t(S)) {
    S.ach[a.id] = Date.now(); S.coins += a.r;
    setTimeout(() => { toast(`🏆 ${a.name}  +${a.r}`); SFX.sparkle(); }, 600);
  }
}

  // ---- fundal static desenat o singură dată ----
  buildCache() {
    const c0 = document.createElement('canvas'); c0.width = Math.round(W * DPR); c0.height = Math.round(H * DPR);
    const c = c0.getContext('2d'); c.setTransform(DPR, 0, 0, DPR, 0, 0);
    const fy = this.floorY;
    let g = c.createLinearGradient(0, 0, 0, fy); g.addColorStop(0, '#ffe6ee'); g.addColorStop(1, '#ffd2df'); c.fillStyle = g; c.fillRect(0, 0, W, fy);
    c.globalAlpha = .28; let row = 0;
    for (let y = 24; y < fy - 10; y += 48, row++) for (let x = (row % 2) * 30 + 14; x < W; x += 60) {
      if (row % 2) drawHeart(c, x, y, 11, '#ff9cbc'); else { ell(c, x, y, 3, 3); c.fillStyle = '#ff9cbc'; c.fill(); } }
    c.globalAlpha = 1;
    g = c.createLinearGradient(0, fy, 0, H); g.addColorStop(0, '#e7b48a'); g.addColorStop(1, '#d4976b'); c.fillStyle = g; c.fillRect(0, fy, W, H - fy);
    c.strokeStyle = 'rgba(120,70,40,.22)'; c.lineWidth = 2;
    let ph = 26, yy = fy + 8, r = 0;
    while (yy < H) { c.beginPath(); c.moveTo(0, yy); c.lineTo(W, yy); c.stroke();
      for (let x = (r % 2) * 90 + 40; x < W; x += 180) { c.beginPath(); c.moveTo(x, yy); c.lineTo(x, yy + ph); c.stroke(); }

      ell(c, W * .5, lerp(fy, this.bottom, .6), Math.min(W * .3, 300) * .78, Math.min(W * .3, 300) * .16); c.strokeStyle = '#fff'; c.lineWidth = 3; c.setLineDash([8, 8]); c.stroke(); c.setLineDash([]); }
    if (S.owned.painting) { const px = W * .78, py = this.top + (fy - this.top) * .4, pw = Math.min(110, W * .14);
      rrect(c, px - pw / 2, py - pw * .45, pw, pw * .9, 6); fs(c, '#c98a4a', 3); rrect(c, px - pw / 2 + 8, py - pw * .45 + 8, pw - 16, pw * .9 - 16, 3); fs(c, '#fff3f6', 2);
      drawHeart(c, px, py, pw * .5, '#ff5c8a', 2.5); }

  },
  windowRect() {

  drawWindow(c, t) {
    const r = this.windowRect(), h = hourNow();
    const night = h < 6.5 || h >= 20.5, dusk = (h >= 18 && h < 20.5) || (h >= 6.5 && h < 8);

    if (night) { for (let i = 0; i < 18; i++) { const sx = r.x + ((i * 97) % r.w), sy = r.y + ((i * 53) % (r.h * .7)); c.globalAlpha = .5 + .5 * Math.sin(t * 2 + i); ell(c, sx, sy, 1.4, 1.4); c.fillStyle = '#fff'; c.fill(); }
      c.globalAlpha = 1; ell(c, r.x + r.w * .72, r.y + r.h * .3, 16, 16); c.fillStyle = '#fff6c9'; c.fill(); ell(c, r.x + r.w * .72 + 7, r.y + r.h * .3 - 4, 13, 13); c.fillStyle = '#2a2d62'; c.fill(); }

      this.cloudX = (this.cloudX + .15) % (r.w + 120);
      for (const [ox, oy, sc] of [[0, .35, 1], [r.w * .55, .62, .7]]) { const cx = r.x - 60 + (this.cloudX + ox) % (r.w + 120), cy = r.y + r.h * oy;
        c.fillStyle = 'rgba(255,255,255,.9)'; ell(c, cx, cy, 24 * sc, 11 * sc); c.fill(); ell(c, cx + 14 * sc, cy - 7 * sc, 15 * sc, 11 * sc); c.fill(); ell(c, cx - 12 * sc, cy - 4 * sc, 12 * sc, 9 * sc); c.fill(); } }
    c.fillStyle = night ? '#2c2f55' : '#9bd59a'; c.beginPath(); c.moveTo(r.x, r.y + r.h);
    for (let x = 0; x <= r.w; x += 10) c.lineTo(r.x + x, r.y + r.h * .86 - Math.sin(x * .03) * 8); c.lineTo(r.x + r.w, r.y + r.h); c.fill();
    c.restore();
    c.strokeStyle = '#fff'; c.lineWidth = 6; c.beginPath(); c.moveTo(r.x + r.w / 2, r.y); c.lineTo(r.x + r.w / 2, r.y + r.h); c.moveTo(r.x, r.y + r.h / 2); c.lineTo(r.x + r.w, r.y + r.h / 2); c.stroke();
    rrect(c, r.x - 8, r.y - 8, r.w + 16, r.h + 16, 12); c.lineWidth = 3; c.strokeStyle = OL; c.stroke();
    // perdele
    for (const s of [-1, 1]) { const x0 = s < 0 ? r.x - 22 : r.x + r.w + 22;
      c.beginPath(); c.moveTo(x0, r.y - 18); c.lineTo(x0 - s * r.w * .2, r.y - 18); c.quadraticCurveTo(x0 - s * r.w * .08, r.y + r.h * .5, x0 - s * r.w * .16, r.y + r.h + 20);

    rrect(c, r.x - 30, r.y - 26, r.w + 60, 10, 5); fs(c, '#c98a4a', 2.5);

        c.beginPath(); c.moveTo(fx - 7, fy2 - 2); c.lineTo(fx - 7, fy2 - 12); c.lineTo(fx - 3, fy2 - 7); c.lineTo(fx, fy2 - 13); c.lineTo(fx + 3, fy2 - 7); c.lineTo(fx + 7, fy2 - 12); c.lineTo(fx + 7, fy2 - 2); c.quadraticCurveTo(fx, fy2 + 5, fx - 7, fy2 - 2);

  id:'whack', title:'Șoricei năzdrăvani', icon:'🐭', bg:'#fde2c8', desc:'Atinge șoriceii care ies din găuri. Nu atinge cățelul!',

  resize() {

  info() { return [`🐭 ${this.score}`, `⏱ ${Math.ceil(this.time)}`, this.combo >= 4 ? `x${1 + Math.floor(this.combo / 4)}` : null]; },

      if (h.t < .15) h.up = h.t / .15; else if (h.t < .15 + h.dur) h.up = 1; else { h.up = 1 - (h.t - .15 - h.dur) / .15; if (h.up <= 0) { if (h.k === 'mouse' || h.k === 'gold') this.combo = 0; h.k = null; } }

  },
  down(x, y) {

    for (const h of this.holes) { const d = Math.hypot(x - h.x, (y - (h.y - 45 * this.hs)) * .8); if (d < bd) { bd = d; best = h; } }

    for (const it of this.items) { if (it.k === 'gold') { c.globalAlpha = .4; ell(c, it.x, it.y, 22 * k, 22 * k); c.fillStyle = '#fff3a0'; c.fill(); c.globalAlpha = 1; } drawFish(c, it.x, it.y + Math.sin(t * 5 + it.x * .02) * 4, 30 * k, it.k === 'gold' ? '#ffcc33' : '#6fb7ff', 0, it.k === 'gold' ? '#fff3b0' : '#d6ecff'); }

    drawCat(c, catOpts({x:cat.x, y:cat.y, s:.62 * k, t, rot:cat.rot, squash:cat.sq - (cat.ground ? 0 : .06), walking:cat.ground, walk:t * 22, mood:this.over ? 'dizzy' : cat.ground ? 'neutral' : 'happy', lookX:1, bob:cat.ground ? Math.abs(Math.sin(t * 22)) * -4 : 0, tailFast:true}));
  },
  down() {
    const cat = this.cat, k = this.k; this.hold = true;
    if (cat.ground) { cat.vy = -820 * k; cat.ground = false; cat.jumps = 1; SFX.jump(); }
    else if (cat.jumps < 2) { cat.vy = -720 * k; cat.jumps = 2; SFX.jump(); sparkles(cat.x, cat.y, 6, '#fff'); }
  },
  up() { this.hold = false; },
  reward() { return {coins:Math.floor(this.score / 5), xp:5 + (this.score / 15 | 0)}; },
};

// ---------- 4. Memorie cu mustăți ----------
const GMem = {
  id:'mem', title:'Memorie cu mustăți', icon:'🃏', bg:'#ffe0ea', desc:'Găsește perechile. Trei niveluri, tot mai multe cărți.',
  SYMS:['🐟', '🧶', '🐭', '🥛', '🎀', '👑', '🌸', '🍰', '🐾', '⭐', '💖', '🦋'],
  start() { this.run = (this.run || 0) + 1; this.round = 0; this.score = 0; this.over = false; this.next(); },
  next() {
    const sizes = [[3, 4], [4, 4], [4, 5]];
    const [a, b] = sizes[this.round]; this.cards = [];
    const pairs = a * b / 2, syms = this.SYMS.slice().sort(() => Math.random() - .5).slice(0, pairs);
    const deck = syms.concat(syms).sort(() => Math.random() - .5);
    deck.forEach(s => this.cards.push({s, f:0, open:false, done:false, shake:0}));
    this.dims = [a, b]; this.open = []; this.lock = 0; this.moves = 0; this.rt = 0; this.pairs = pairs; this.found = 0; this.banner = 1.4; this.resize();
  },
  resize() {
    if (!this.cards) return;
    let [a, b] = this.dims; const top = 96, avW = W - 32, avH = H - top - 24;
    if ((avW > avH) !== (b > a)) [a, b] = [b, a];
    const sz = Math.min(avW / b, avH / a) - 10, cw = Math.min(sz, 150), ch = cw * 1.2 > avH / a - 10 ? avH / a - 10 : cw * 1.2;
    const gw = b * (cw + 10) - 10, gh = a * (ch + 10) - 10, ox = (W - gw) / 2, oy = top + (avH - gh) / 2;
    this.cards.forEach((cd, i) => { const r = Math.floor(i / b), q = i % b; cd.x = ox + q * (cw + 10); cd.y = oy + r * (ch + 10); cd.w = cw; cd.h = ch; });
  },
  info() { return [`Nivel ${this.round + 1}/3`, `⭐ ${this.score}`, `🔄 ${this.moves}`]; },
  update(dt) {
    this.rt += dt; this.banner = Math.max(0, this.banner - dt);
    for (const cd of this.cards) { cd.f = lerp(cd.f, cd.open || cd.done ? 1 : 0, Math.min(1, dt * 12)); cd.shake = Math.max(0, cd.shake - dt); }
    if (this.lock > 0) { this.lock -= dt; if (this.lock <= 0) {
      const [a, b] = this.open;
      if (a.s === b.s) { a.done = b.done = true; this.found++; this.score += 20; SFX.sparkle(); sparkles(a.x + a.w / 2, a.y + a.h / 2, 10); sparkles(b.x + b.w / 2, b.y + b.h / 2, 10);
        if (this.found === this.pairs) { const bonus = Math.max(0, this.pairs * 3 - (this.moves - this.pairs)) * 5; this.score += bonus; floatText(W / 2, H / 2, `Bravo! +${bonus}`, '#ff5c8a', 34); confetti(60); SFX.level();
          this.round++; const run = this.run; if (this.round >= 3) { S.st.memDone++; setTimeout(() => { if (run === this.run) this.over = true; }, 1200); } else setTimeout(() => { if (run === this.run && game === this) this.next(); }, 1500); } }
      else { a.open = b.open = false; a.shake = b.shake = .3; }
      this.open = [];
    } }
  },
  draw(c, t) {
    const g = c.createLinearGradient(0, 0, W, H); g.addColorStop(0, '#ffe6ee'); g.addColorStop(1, '#ffd0f0'); c.fillStyle = g; c.fillRect(0, 0, W, H);
    c.globalAlpha = .18; for (let y = 30; y < H; y += 90) for (let x = ((y / 90) % 2) * 45 + 20; x < W; x += 90) drawPaw(c, x, y, .5, '#ff9cbc', '#ff9cbc'); c.globalAlpha = 1;
    for (const cd of this.cards) {
      const sx = Math.abs(Math.cos(cd.f * Math.PI)), face = cd.f > .5, cx = cd.x + cd.w / 2 + Math.sin(cd.shake * 40) * 6 * (cd.shake > 0), cy = cd.y + cd.h / 2;
      c.save(); c.translate(cx, cy); c.scale(Math.max(.02, sx), 1);
      rrect(c, -cd.w / 2, -cd.h / 2 + 4, cd.w, cd.h, 14); c.fillStyle = 'rgba(74,47,63,.18)'; c.fill();
      rrect(c, -cd.w / 2, -cd.h / 2, cd.w, cd.h, 14); fs(c, face ? (cd.done ? '#e6fff4' : '#fff') : '#ff8fb3', 3);
      if (face) { c.font = `${cd.w * .5}px sans-serif`; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText(cd.s, 0, 3); c.textBaseline = 'alphabetic'; }
      else { drawPaw(c, 0, 4, cd.w / 110, '#ffc2d6', '#ff8fb3'); }
      c.restore();
    }
    if (this.banner > 0) { c.globalAlpha = Math.min(1, this.banner * 2); txt(c, `Nivelul ${this.round + 1}`, W / 2, H / 2, 54, '#ff5c8a'); c.globalAlpha = 1; }
  },
  down(x, y) {
    if (this.lock > 0 || this.banner > .8) return;
    const cd = this.cards.find(c => x > c.x && x < c.x + c.w && y > c.y && y < c.y + c.h);
    if (!cd || cd.open || cd.done) return;
    cd.open = true; this.open.push(cd); SFX.card();
    if (this.open.length === 2) { this.moves++; this.lock = .65; }
  },
  reward() { return {coins:Math.floor(this.score / 4), xp:5 + (this.score / 10 | 0)}; },
};

// ---------- 5. Turnul de pisici ----------
const GTower = {
  id:'tower', title:'Turnul de pisici', icon:'🗼', bg:'#d4f4e8', desc:'Atinge ca să lași pisica de pe nor. Construiește cel mai înalt turn!',
  start() { this.run = (this.run || 0) + 1; this.resize(); this.stack = []; this.score = 0; this.lives = 3; this.over = false; this.t = 0; this.cam = 0; this.fall = null; this.drops = []; this.newHang(); this.perfectRow = 0; },
  resize() { this.s = clamp(Math.min(W, H) / 640, .6, 1.25); this.step = 40 * this.s; this.w = 92 * this.s; this.base = H - 70; this.hangY = 150 + 40 * this.s; },
  newHang() { this.hang = {fur:pick(Object.keys(FURS)), eyes:pick(Object.keys(EYES)), hat:Math.random() < .3 ? pick(HATS).id : null}; this.ph = rand(0, TAU); },
  info() { return [`🐱 ${this.score}`, '❤️'.repeat(this.lives) + '🤍'.repeat(Math.max(0, 3 - this.lives))]; },
  topX() { return this.stack.length ? this.stack[this.stack.length - 1].x : W / 2; },
  hx() { const amp = Math.min(W * .36, 300); return W / 2 + Math.sin(this.ph) * amp; },
  update(dt) {
    this.t += dt; this.ph += dt * Math.min(3.6, 1.4 + this.stack.length * .09);
    const target = Math.max(0, this.stack.length * this.step - (this.base - this.hangY) * .55); this.cam = lerp(this.cam, target, dt * 3);
    if (this.fall) {
      const f = this.fall; f.vy += 2200 * dt; f.y += f.vy * dt;
      const landY = -(this.stack.length) * this.step;
      if (!f.miss && f.y >= landY) {
        const dx = f.x - this.topX();
        if (Math.abs(dx) <= this.w * .55) {
          let perfect = Math.abs(dx) < 7 * this.s;
          this.stack.push({x:perfect ? this.topX() : f.x, fur:f.fur, eyes:f.eyes, hat:f.hat, sq:.3, mood:perfect ? 'love' : 'happy'});
          this.score++;
          if (perfect) { this.perfectRow++; this.score += 1; floatText(f.x, this.scr(landY) - 50 * this.s, this.perfectRow > 1 ? `Perfect x${this.perfectRow}!` : 'Perfect!', '#ff5c8a', 26); sparkles(f.x, this.scr(landY) - 20, 14); SFX.sparkle(); }
          else { this.perfectRow = 0; SFX.pop(); }
          SFX.meow(1.3 + Math.random() * .3);
          this.fall = null; this.newHang();
        } else { f.miss = true; f.vr = dx > 0 ? 5 : -5; f.vx = dx > 0 ? 160 : -160; this.lives--; this.perfectRow = 0; SFX.hit(); floatText(f.x, this.scr(f.y) - 40, 'Ups!', '#d43c5f');
          if (this.lives <= 0) { const run = this.run; setTimeout(() => { if (run === this.run && !this.over) { this.over = true; SFX.fail(); } }, 700); } }
      }
      if (f.miss) { f.x += f.vx * dt; f.rot = (f.rot || 0) + f.vr * dt; if (this.scr(f.y) > H + 100) { this.fall = null; if (this.lives > 0) this.newHang(); } }
    }
    for (const s of this.stack) s.sq *= Math.pow(.002, dt);
  },
  scr(wy) { return this.base + wy + this.cam; },
  draw(c, t) {
    const h = this.stack.length, k = clamp(h / 30, 0, 1);
    const g = c.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, `hsl(${lerp(200, 250, k)},${lerp(80, 45, k)}%,${lerp(72, 18, k)}%)`); g.addColorStop(1, `hsl(${lerp(190, 300, k)},${lerp(80, 50, k)}%,${lerp(90, 40, k)}%)`);
    c.fillStyle = g; c.fillRect(0, 0, W, H);
    if (k > .3) { c.globalAlpha = (k - .3) * 1.4; for (let i = 0; i < 50; i++) { ell(c, (i * 131) % W, (i * 89 + this.cam * .2) % H, 1.3, 1.3); c.fillStyle = '#fff'; c.fill(); } c.globalAlpha = 1; }
    for (let i = 0; i < 6; i++) { const cy = ((i * 170 + this.cam * .5) % (H + 200)) - 100, cx = (i * 211 + t * 10) % (W + 160) - 80; c.fillStyle = 'rgba(255,255,255,.55)'; ell(c, cx, cy, 60, 20); c.fill(); ell(c, cx + 30, cy - 10, 34, 18); c.fill(); }
    const by = this.scr(0);
    if (by < H + 60) { c.fillStyle = '#9bd59a'; c.fillRect(0, by + 10, W, H); ell(c, W / 2, by + 6, this.w * .8, 16 * this.s); fs(c, '#ff8fb3'); }
    const sway = Math.sin(t * 1.6) * Math.min(.04, h * .002);
    this.stack.forEach((s, i) => {
      const y = this.scr(-i * this.step); if (y < -100 || y > H + 100) return;
      const x = s.x + Math.sin(sway) * i * this.step;
      drawCat(c, {x, y: y + 4 * this.s, s:this.s, pose:'sleep', fur:s.fur, eyes:s.eyes, hat:s.hat, t:t + i, mood:i === h - 1 ? s.mood : 'sleep', squash:s.sq});
    });
    // norul și pisica de sus
    if (!this.fall && this.lives > 0) {
      const x = this.hx(), y = this.hangY;
      drawCat(c, {x, y, s:this.s, pose:'sleep', fur:this.hang.fur, eyes:this.hang.eyes, hat:this.hang.hat, t, mood:'neutral', lookY:1});
      c.fillStyle = '#fff'; for (const [ox, oy, r] of [[-40, 8, 22], [-10, 12, 26], [24, 10, 24], [50, 6, 18]]) { ell(c, x + ox * this.s, y + oy * this.s, r * this.s, r * .7 * this.s); c.fill(); }
      c.setLineDash([6, 8]); c.strokeStyle = 'rgba(74,47,63,.25)'; c.lineWidth = 2; c.beginPath(); c.moveTo(x, y + 24 * this.s); c.lineTo(x, this.scr(-h * this.step) - 30 * this.s); c.stroke(); c.setLineDash([]);
    }
    if (this.fall) { const f = this.fall; drawCat(c, {x:f.x, y:this.scr(f.y), s:this.s, pose:'sleep', fur:f.fur, eyes:f.eyes, hat:f.hat, t, mood:f.miss ? 'dizzy' : 'surprised', rot:f.rot || 0}); }
  },
  down() {
    if (this.fall || this.lives <= 0) return;
    const x = this.hx();
    this.fall = Object.assign({x, y:this.hangY - this.base - this.cam, vy:0}, this.hang); SFX.click();
  },
  reward() { return {coins:this.score * 3, xp:5 + this.score}; },
};
const GAMES = [GCatch, GWhack, GRun, GMem, GTower];

/* ---------- rularea jocurilor ---------- */
let game = null, paused = false, endT = 0, lastInfo = '';
function startGame(G) {
  closeModal(); SFX.purrOff(); room.laser = null; room.ptr = null;
  if (S.sleeping) room.wake();
  game = G; paused = false; endT = 0; P.length = 0;
  stat('energy', -8); stat('fun', 8); S.played[G.id] = 1;
  $('#hud').hidden = true; $('#dock').hidden = true; $('#ghud').hidden = false; $('#gPause').textContent = 'II';
  G.start(); lastInfo = ''; SFX.meow(1.1); checkAch();
}
function endGame() {
  const G = game, r = G.reward(), best = S.best[G.id] || 0, rec = G.score > best;
  if (rec) S.best[G.id] = G.score;
  S.coins += r.coins; addXP(r.xp); save(); updateHud();
  const msg = G.score === 0 ? 'Nu-i nimic, mai încearcă!' : rec && best ? 'Record nou! 🎉' : G.score > best * .7 ? 'Super tare!' : 'Bravo!';
  if (rec && best) { confetti(100); SFX.level(); }
  openModal(G.title, `<div class="result"><canvas class="prev" id="rPrev"></canvas><div class="score">${G.score}</div><div class="sub">${msg}</div>
    <div class="chips"><span class="chip"><span class="coin"></span>+${r.coins}</span><span class="chip">⭐ +${r.xp} XP</span><span class="chip">🏆 Record: ${Math.max(best, G.score)}</span></div>
    <div class="row"><button class="big" id="rAgain">Încă o dată</button><button class="big alt" id="rHome">Acasă</button></div></div>`, b => {
    renderThumb(b.querySelector('#rPrev'), {mood:G.score > 0 ? (rec ? 'love' : 'happy') : 'sad'}, 180);
    b.querySelector('#rAgain').onclick = () => { if (S.energy < 8) { toast(`${S.name} e obosită. Las-o să doarmă puțin.`); exitGame(); return; } startGame(G); };
    b.querySelector('#rHome').onclick = exitGame;
  }, false);
  checkAch();
}
function exitGame() {
  closeModal(); game = null; paused = false; P.length = 0;
  $('#ghud').hidden = true; $('#hud').hidden = false; $('#dock').hidden = false; lastHud = ''; updateHud(); room.layout(); save();
}
function pauseGame() {
  if (!game || game.over) return;
  paused = true; $('#gPause').textContent = '▶';
  openModal('Pauză', `<div class="result"><canvas class="prev" id="pPrev"></canvas><div class="row"><button class="big" id="pGo">Continuă</button><button class="big alt" id="pOut">Ieși din joc</button></div></div>`, b => {
    renderThumb(b.querySelector('#pPrev'), {mood:'sleep', pose:'sleep'}, 180);
    b.querySelector('#pGo').onclick = () => closeModal();
    b.querySelector('#pOut').onclick = () => { closeModal(); game.over = true; endT = 99; };
  }, () => { paused = false; $('#gPause').textContent = 'II'; });
}
$('#gPause').onclick = () => { SFX.click(); paused ? closeModal() : pauseGame(); };
$('#gExit').onclick = () => { SFX.click(); if (game && !game.over) { game.over = true; endT = 99; } };
document.addEventListener('visibilitychange', () => { if (document.hidden && game && !game.over && !paused) pauseGame(); });

/* ---------- dock ---------- */
const btn = (id, fn) => $(id).onclick = () => { SFX.click(); fn(); };
btn('#dFood', showFood); btn('#dGames', showGames); btn('#dShop', showShop); btn('#dWard', showWardrobe);
btn('#dNotes', showNotes); btn('#dAch', showAch); btn('#dSet', showSettings);
btn('#dSleep', () => room.sleep());
btn('#dLaser', () => { room.laserOn = !room.laserOn; $('#dLaser').classList.toggle('on', room.laserOn); if (room.laserOn) { if (S.sleeping) room.wake(); toast('Trage cu degetul pe podea 🔴'); } });

/* ---------- intrare ---------- */
cv.addEventListener('pointerdown', e => { try { cv.setPointerCapture(e.pointerId); } catch (_) {} const t = game ? game : room; if (game && (paused || game.over)) return; t.down && t.down(e.clientX, e.clientY); });
cv.addEventListener('pointermove', e => { const t = game ? game : room; if (game && (paused || game.over)) return; t.move && t.move(e.clientX, e.clientY); });
const up = e => { const t = game ? game : room; t.up && t.up(e.clientX, e.clientY); };
cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up);
document.addEventListener('keydown', e => { if (game && (e.code === 'Space' || e.code === 'ArrowUp') && !paused && !game.over) { e.preventDefault(); game.down && game.down(W / 2, H / 2); } });
document.addEventListener('keyup', e => { if (game && game.up) game.up(); });

/* ---------- bucla principală ---------- */
let lastT = performance.now(), T = 0;
function frame(now) {
  const dt = Math.min(.05, (now - lastT) / 1000); lastT = now; T += dt;
  musicTick(dt);
  if (game) {
    if (!paused && !game.over) game.update(dt);
    if (game.over && !paused) { endT += dt; if (endT > .9 && $('#modal').hidden) { endT = -1e9; endGame(); } }
    game.draw(ctx, T);
    const info = game.info().filter(Boolean).map(s => `<span class="pill">${s}</span>`).join('');
    if (info !== lastInfo) { $('#ginfo').innerHTML = info; lastInfo = info; }
  } else {
    room.update(dt, T); room.draw(ctx, T);
    saveT += dt; if (saveT > 5) { saveT = 0; save(); }
    if ((T * 2 | 0) % 2 === 0) updateHud();
  }
  if (!paused) updP(dt);
  drawP(ctx);
  requestAnimationFrame(frame);
}
function boot() {
  $('#hud').hidden = false; $('#dock').hidden = false;
  resize(); updateHud();
  if (!S.setup) showSetup(false);
  else if (S.lastGift !== today()) setTimeout(() => toast('🎁 Te așteaptă un cadou în cameră!'), 800);
  checkAch();
  requestAnimationFrame(frame);
}
boot();
</script>
